plugins {
    id 'com.android.library'
}
android {
    namespace = 'com.shihab.diplay.shared'
    compileSdk = 37

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdk = 19
        targetSdk = 19
        multiDexEnabled true

        ndk {
            // CS75 Plus car: armeabi-v7a. Override with -PnativeAbi=x86 for an emulator package.
            abiFilters (findProperty('nativeAbi') ?: 'armeabi-v7a')
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-19'
                arguments "APP_ABI=${findProperty('nativeAbi') ?: 'armeabi-v7a'}"
                if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
                    arguments 'HOST_OS=windows'
                }
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // NDK r25c is the last supported toolchain that still targets Android 4.4 (API 19).
    ndkVersion = '25.2.9519653'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
    lint {
        // The lint analyzer crashes inside its own Kotlin PSI JavaDocParser
        // (NoSuchMethodError: java.util.List.removeLast(), a lint/JDK toolchain mismatch),
        // which would otherwise fail lintVitalAnalyzeRelease and block the signed release build.
        checkReleaseBuilds = false
        abortOnError = false
    }
}
dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation libs.bouncycastle
    api 'org.conscrypt:conscrypt-android:2.5.2'
    testImplementation 'org.conscrypt:conscrypt-openjdk-uber:2.5.2'
    implementation libs.slf4j.api
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}

// Resolve the pinned software Opus sources before Android Gradle Plugin configures ndk-build.
// This also covers local Android Studio builds, not only CI.
def prepareOpusSources = tasks.register('prepareOpusSources', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/prepare-libopus.py'
}
def prepareLwipSources = tasks.register('prepareLwipSources', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/prepare-lwip.py'
}
def needsPinnedNativeSources = { String name ->
    // AGP 9 configures ndk-build as configureNdkBuild* before externalNativeBuild*.
    // Android.mk refuses to parse until the pinned sources exist, so this must run first.
    name.startsWith('generateJsonModel') ||
        name.startsWith('externalNativeBuild') ||
        name.startsWith('configureNdkBuild') ||
        name.startsWith('buildNdkBuild')
}
tasks.configureEach { task ->
    if (needsPinnedNativeSources(task.name)) {
        task.dependsOn(prepareOpusSources, prepareLwipSources)
    }
}

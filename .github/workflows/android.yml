name: Android

on:
  pull_request:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on the runner}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;25.2.9519653"
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Prepare native libopus sources
        run: python3 scripts/prepare-libopus.py

      - name: Prepare native lwIP sources
        run: python3 scripts/prepare-lwip.py

      - name: Unit tests and debug APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :shared:testDebugUnitTest \
            :common:testDebugUnitTest \
            :mobile:assembleDebug

      # Same lint toolchain bug as in release.yml (JavaDocParser NoSuchMethodError:
      # java.util.List.removeLast()) keeps this non-blocking so it never red-lines CI.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :mobile:lintDebug

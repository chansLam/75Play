name: Promote beta 2.0.6-beta.2

on:
  push:
    branches:
      - ci-release-2.0.6-beta.2

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply CarPlay fix
        run: |
          set -euo pipefail
          git fetch origin ci-flower-94ac03e
          git show origin/ci-flower-94ac03e:.github/ci-flower.patch.b64 \
            | base64 -d > "$RUNNER_TEMP/carplay-fix.patch"
          git apply --verbose "$RUNNER_TEMP/carplay-fix.patch"
          git diff --stat

      - name: Bump beta version
        run: |
          set -euo pipefail
          sed -i 's/versionCode = 206/versionCode = 207/' mobile/build.gradle.kts
          sed -i 's/versionName = "2.0.6-beta"/versionName = "2.0.6-beta.2"/' mobile/build.gradle.kts
          grep -q 'versionCode = 207' mobile/build.gradle.kts
          grep -q 'versionName = "2.0.6-beta.2"' mobile/build.gradle.kts
          sed -n '36,39p' mobile/build.gradle.kts

      - name: Commit and tag main
        run: |
          set -euo pipefail
          git config user.name "chanslam"
          git config user.email "chanslam@users.noreply.github.com"
          git add -A
          git commit -m "fix: smooth CarPlay startup video and absorb connection burst"
          git push origin HEAD:main
          git tag -a v2.0.6-beta.2 -m "75Play 2.0.6-beta.2"
          git push origin refs/tags/v2.0.6-beta.2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on the runner}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;25.2.9519653"
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Materialize signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64:-}" || { echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Materialize offline MFi runtime assets
        env:
          DIPLAY_AUTH_IDENTITY_PK8_BASE64: ${{ secrets.DIPLAY_AUTH_IDENTITY_PK8_BASE64 }}
          DIPLAY_AUTH_CERTIFICATE_P7B_BASE64: ${{ secrets.DIPLAY_AUTH_CERTIFICATE_P7B_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${DIPLAY_AUTH_IDENTITY_PK8_BASE64:-}" || { echo "::error::Missing secret DIPLAY_AUTH_IDENTITY_PK8_BASE64"; exit 1; }
          test -n "${DIPLAY_AUTH_CERTIFICATE_P7B_BASE64:-}" || { echo "::error::Missing secret DIPLAY_AUTH_CERTIFICATE_P7B_BASE64"; exit 1; }
          assets="$RUNNER_TEMP/runtime-assets/offline-mfi"
          mkdir -p "$assets"
          echo "$DIPLAY_AUTH_IDENTITY_PK8_BASE64" | base64 -d > "$assets/identity.pk8"
          echo "$DIPLAY_AUTH_CERTIFICATE_P7B_BASE64" | base64 -d > "$assets/certificate.p7b"
          echo "DIPLAY_AUTH_ASSETS_DIR=$RUNNER_TEMP/runtime-assets" >> "$GITHUB_ENV"

      - name: Prepare native libopus sources
        run: python3 scripts/prepare-libopus.py

      - name: Prepare native lwIP sources
        run: python3 scripts/prepare-lwip.py

      - name: Unit tests and lint
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :shared:testDebugUnitTest \
            :common:testDebugUnitTest \
            :mobile:lintDebug

      - name: Build signed standalone beta APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :mobile:assembleStandaloneRelease
          mkdir -p dist
          cp mobile/build/outputs/apk/release/mobile-release.apk "dist/75Play-v2.0.6-beta.2-release.apk"
          (
            cd dist
            sha256sum "75Play-v2.0.6-beta.2-release.apk" | tee "75Play-v2.0.6-beta.2-release.apk.sha256"
          )

      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v2.0.6-beta.2 --yes 2>/dev/null || true
          gh release create v2.0.6-beta.2 \
            --prerelease \
            --target "$(git rev-parse HEAD)" \
            --title "75Play 2.0.6-beta.2" \
            --notes "## 75Play 2.0.6-beta.2

          相对 2.0.6-beta 的测试版，修复 CarPlay 连接阶段花屏。

          ### 修复

          - **CarPlay 连接花屏**：首帧到达前先盖黑色遮罩，解码器真正出画后再显示，避免 Surface 初始化时露出噪点或彩色块。
          - **连接突发**：视频帧队列由 12 帧 / 2 MB 提升到 24 帧 / 3 MB，减少参考帧被挤掉后短暂花屏。
          - **解码恢复**：连续 2 帧未出队才请求关键帧，不再把正常解码误判成卡住。

          ### 说明

          - 标签 \`v2.0.6-beta.2\` 为预发布。应用内更新不推送测试版。" \
            "dist/75Play-v2.0.6-beta.2-release.apk" \
            "dist/75Play-v2.0.6-beta.2-release.apk.sha256"

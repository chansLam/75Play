name: CI debug
on:
  push:
    branches: [ci-debug]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;25.2.9519653"
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
      - name: Prepare native libopus sources
        run: python3 scripts/prepare-libopus.py
      - name: Prepare native lwIP sources
        run: python3 scripts/prepare-lwip.py
      - name: Run diagnostics and publish log
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug > /tmp/ci.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" > ci-failure.txt
          tail -500 /tmp/ci.log >> ci-failure.txt
          git config user.name chanslam
          git config user.email chanslam@users.noreply.github.com
          git add ci-failure.txt
          git commit -m "CI diagnostic log [skip ci]" || true
          git push origin HEAD:ci-log
          exit $code
